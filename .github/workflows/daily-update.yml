name: Daily Profile Update

on:
  schedule:
    # Har kuni soat 6:00 UTC da ishga tushadi
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          # README oxiriga qator qo'shmaydi — faqat <!--UPDATED--> belgisi ichidagi sanani almashtiradi
          STAMP="$(TZ=Asia/Tashkent date '+%d.%m.%Y')"
          sed -i "s|<!--UPDATED-->.*<!--/UPDATED-->|<!--UPDATED-->${STAMP}<!--/UPDATED-->|" README.md
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update: Daily profile stats" || echo "No changes to commit"
          git push origin main || echo "Push failed"
