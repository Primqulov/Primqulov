<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #C9C6FF; }
    .name { font-size: 78px; font-weight: 800; letter-spacing: -2px; }
    .sub { font-size: 21px; font-weight: 500; fill: #A9B1D6; }
    .loc { font-size: 16px; font-weight: 500; fill: #6B7394; }
    .chip { font-size: 14px; font-weight: 600; fill: #E6E8F5; }
    .fade1 { animation: up .9s cubic-bezier(.2,.8,.2,1) .1s backwards; }
    .fade2 { animation: up .9s cubic-bezier(.2,.8,.2,1) .25s backwards; }
    .fade3 { animation: up .9s cubic-bezier(.2,.8,.2,1) .4s backwards; }
    .fade4 { animation: up .9s cubic-bezier(.2,.8,.2,1) .55s backwards; }
    .fade5 { animation: up .9s cubic-bezier(.2,.8,.2,1) .7s backwards; }
    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    .float3 { animation: float 5.5s ease-in-out -4s infinite; }
    .phone { animation: float 8s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 101px 113px; }
    .bar { animation: load 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } }
    @keyframes load { 0% { transform: scaleX(.15); } 60%, 100% { transform: scaleX(1); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1224"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(320)">
      <stop stop-color="#6C63FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(280)">
      <stop stop-color="#00D2FF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B85FF"/>
      <stop offset=".5" stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#8B85FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0;-300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="phoneStroke" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B85FF"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="flutter" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#47C5FB"/>
      <stop offset="1" stop-color="#0175C2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="gridFade" cx=".75" cy=".4" r=".7">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="420" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
    <g>
      <circle r="320" fill="url(#glowA)" cx="0" cy="0">
        <animateMotion dur="18s" repeatCount="indefinite" path="M960 60 C1100 180 820 360 900 300 C980 240 820 20 960 60Z"/>
      </circle>
      <circle r="280" fill="url(#glowB)" cx="0" cy="0">
        <animateMotion dur="22s" repeatCount="indefinite" path="M180 420 C360 330 80 260 260 380 C440 500 60 470 180 420Z"/>
      </circle>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" stroke="url(#stroke)"/>

  <!-- Eyebrow pill -->
  <g class="fade1">
    <rect x="80" y="94" width="238" height="36" rx="18" fill="#6C63FF" fill-opacity=".14" stroke="#6C63FF" stroke-opacity=".45"/>
    <circle class="pulse" cx="101" cy="112" r="4.5" fill="#00D2FF"/>
    <text x="116" y="117" class="eyebrow">FLUTTER DEVELOPER</text>
  </g>

  <!-- Name -->
  <text x="76" y="212" class="name fade2" fill="#FFFFFF">Diyorbek</text>
  <text x="76" y="292" class="name fade3" fill="url(#nameGrad)">Primqulov</text>

  <!-- Subtitle -->
  <text x="80" y="340" class="sub fade4">Mobile App Engineer  ·  Building Beautiful UIs</text>

  <!-- Location -->
  <g class="fade5">
    <path d="M87 358c-4.4 0-8 3.4-8 7.7 0 5.6 8 13.3 8 13.3s8-7.7 8-13.3c0-4.3-3.6-7.7-8-7.7Zm0 10.4a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6Z" fill="#6C63FF"/>
    <text x="104" y="375" class="loc">Toshkent, O'zbekiston</text>
  </g>

  <!-- Phone mockup -->
  <g class="phone">
    <g transform="translate(872 32)" filter="url(#shadow)">
      <rect width="196" height="356" rx="34" fill="#10162B" stroke="url(#phoneStroke)" stroke-width="1.5"/>
      <rect x="9" y="9" width="178" height="338" rx="26" fill="#0A0F1E"/>
      <rect x="72" y="18" width="52" height="14" rx="7" fill="#05070F"/>
      <!-- app bar -->
      <rect x="24" y="48" width="64" height="9" rx="4.5" fill="#E6E8F5" fill-opacity=".85"/>
      <circle cx="166" cy="52" r="9" fill="url(#thumb)"/>
      <!-- hero card -->
      <rect x="22" y="72" width="152" height="92" rx="16" fill="url(#thumb)"/>
      <path d="M90 104v28l24-14-24-14Z" fill="#FFFFFF" fill-opacity=".95"/>
      <rect x="22" y="176" width="112" height="8" rx="4" fill="#E6E8F5" fill-opacity=".7"/>
      <rect x="22" y="192" width="80" height="7" rx="3.5" fill="#6B7394"/>
      <!-- progress -->
      <rect x="22" y="210" width="152" height="6" rx="3" fill="#1C2340"/>
      <rect class="bar" x="22" y="210" width="152" height="6" rx="3" fill="#00D2FF"/>
      <!-- tiles -->
      <rect x="22" y="230" width="72" height="56" rx="12" fill="#161D36"/>
      <rect x="102" y="230" width="72" height="56" rx="12" fill="#161D36"/>
      <rect x="32" y="242" width="22" height="22" rx="7" fill="#6C63FF" fill-opacity=".85"/>
      <rect x="112" y="242" width="22" height="22" rx="7" fill="#00D2FF" fill-opacity=".85"/>
      <rect x="32" y="272" width="44" height="6" rx="3" fill="#6B7394"/>
      <rect x="112" y="272" width="44" height="6" rx="3" fill="#6B7394"/>
      <!-- bottom nav -->
      <rect x="22" y="302" width="152" height="32" rx="16" fill="#161D36"/>
      <circle cx="52" cy="318" r="5" fill="#8B85FF"/>
      <circle cx="84" cy="318" r="4" fill="#3A4468"/>
      <circle cx="116" cy="318" r="4" fill="#3A4468"/>
      <circle cx="146" cy="318" r="4" fill="#3A4468"/>
    </g>
  </g>

  <!-- Floating chips -->
  <g class="float1">
    <rect x="712" y="96" width="124" height="44" rx="22" fill="#11172C" fill-opacity=".92" stroke="#FFFFFF" stroke-opacity=".1"/>
    <g transform="translate(730 106)">
      <path d="M13 0 0 13l4 4L21 0h-8Z" fill="url(#flutter)"/>
      <path d="M21 12h-8l-7 7 7 7h8l-7-7 7-7Z" fill="#0175C2"/>
    </g>
    <text x="760" y="123" class="chip">Flutter</text>
  </g>
  <g class="float2">
    <rect x="1082" y="128" width="96" height="44" rx="22" fill="#11172C" fill-opacity=".92" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="1106" cy="150" r="9" fill="#0175C2"/>
    <path d="M1102 146h5.5a4 4 0 0 1 0 8H1102v-8Z" fill="#FFFFFF" fill-opacity=".9"/>
    <text x="1124" y="155" class="chip">Dart</text>
  </g>
  <g class="float3">
    <rect x="728" y="286" width="134" height="44" rx="22" fill="#11172C" fill-opacity=".92" stroke="#FFFFFF" stroke-opacity=".1"/>
    <path d="M748 318 752 294l5 9 3-6 9 21-10.5 5.5a2 2 0 0 1-2 0L748 318Z" fill="#FFCA28"/>
    <path d="m760 297 9 21-6-12-3-9Z" fill="#FFA000"/>
    <text x="778" y="313" class="chip">Firebase</text>
  </g>
</svg>
