<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" fill="none">
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 28px; font-weight: 800; fill: #FFFFFF; letter-spacing: -.5px; }
    .desc { font-size: 16px; fill: #A9B1D6; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #7FE7FF; }
    .chip { font-size: 13px; font-weight: 600; fill: #D7DBF0; }
    .glow { animation: breathe 6s ease-in-out -3s infinite; }
    @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="580" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1428"/>
      <stop offset="1" stop-color="#080B16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(560 -10) scale(300)">
      <stop stop-color="#00D2FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#3A7BD5"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="580" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="c"><rect width="580" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="300" fill="url(#bg)"/>
    <rect class="glow" width="580" height="300" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="579" height="299" rx="21.5" stroke="url(#stroke)"/>

  <rect x="32" y="32" width="56" height="56" rx="16" fill="url(#icon)"/>
  <path d="M47 53h26l-2 20a3 3 0 0 1-3 2.7H52a3 3 0 0 1-3-2.7L47 53Z" fill="#FFFFFF"/>
  <path d="M54 55v-4a6 6 0 0 1 12 0v4" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <rect x="418" y="44" width="130" height="30" rx="15" fill="#00D2FF" fill-opacity=".1" stroke="#00D2FF" stroke-opacity=".4"/>
  <text x="483" y="63.5" text-anchor="middle" class="tag">JORIY LOYIHA</text>

  <text x="32" y="138" class="title">Ishchibormi</text>
  <text x="32" y="172" class="desc">O'zbekistondagi universal online bozori</text>
  <text x="32" y="196" class="desc">platformasi.</text>

  <g>
    <rect x="32" y="236" width="86" height="32" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="75" y="256.5" text-anchor="middle" class="chip">Flutter</text>
    <rect x="126" y="236" width="68" height="32" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="160" y="256.5" text-anchor="middle" class="chip">Dart</text>
    <rect x="202" y="236" width="96" height="32" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="250" y="256.5" text-anchor="middle" class="chip">REST API</text>
  </g>
</svg>
